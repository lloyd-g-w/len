# Flatpak of Len, repackaging the Linux release bundle (no Flutter in the
# sandbox build). See README "Release" → Flatpak.
#
#   cp len-X.Y.Z-linux-x64.tar.gz app/linux/packaging/flatpak/len-linux-x64.tar.gz
#   flatpak-builder --user --install --force-clean build-dir app/linux/packaging/flatpak/dev.len.len.yml
#
# CI (.github/workflows/release.yml, job "flatpak") does the same and attaches
# len-X.Y.Z-linux-x64.flatpak to the release. For Flathub, replace the
# archive's `path` with the release tarball's `url` + `sha256` (see
# docs/PACKAGING.md "Flathub").
#
# Audio recording: the runtime has `parecord` and an `ffmpeg` with the AAC
# encoder, which record_linux runs (PATH /app/bin:/usr/bin); the PulseAudio
# socket gives the microphone. check-runtime-recording.sh checks a new
# runtime-version for them.
id: dev.len.len
runtime: org.gnome.Platform # GTK 3 (the Flutter embedder), GStreamer, parecord, ffmpeg
runtime-version: '51'
sdk: org.gnome.Sdk
command: len
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri # GPU rendering, stylus / tablet input
  - --socket=pulseaudio # audio recording (parecord) and playback (GStreamer)
  - --share=network # sync with a self-hosted server
  # Files: the file chooser and "Open with" go through portals; no
  # --filesystem access is needed.
modules:
  - name: len
    buildsystem: simple
    sources:
      - type: archive
        path: len-linux-x64.tar.gz # one top-level directory, stripped
      - type: file
        path: ../dev.len.len.metainfo.xml
    build-commands:
      # The bundle stays together (the runner finds lib/ and data/ next to
      # its executable); bin/len links to it.
      - mkdir -p /app/lib/len /app/bin
      - cp -a len lib data /app/lib/len/
      - ln -s /app/lib/len/len /app/bin/len
      # The runner's window icon (share/icons next to the executable).
      - cp -a share /app/lib/len/
      - install -Dm644 share/applications/dev.len.len.desktop -t /app/share/applications
      - install -Dm644 share/mime/packages/dev.len.len.xml -t /app/share/mime/packages
      - cp -a share/icons /app/share/
      - install -Dm644 dev.len.len.metainfo.xml -t /app/share/metainfo
