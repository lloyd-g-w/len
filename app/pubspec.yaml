name: len
description: "Len — handwriting-first notes with infinite canvas and self-hosted sync."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  archive: ^4.4.0
  audioplayers: ^6.8.1
  cross_file: ^0.3.5+5
  crypto: ^3.0.7
  # MPRIS media controls on Linux (platform/mpris_native.dart; pure Dart,
  # already in the lock through other packages).
  dbus: ^0.7.15
  desktop_drop:
    # Vendored: Built-in Kotlin detector fix (see third_party/README.md).
    path: third_party/desktop_drop
  # A flag shared with the pull worker isolate (platform/write_signal_native.dart;
  # already in the lock through sqlite3).
  ffi: ^2.2.0
  file_selector: ^1.1.0
  google_mlkit_digital_ink_recognition: ^0.16.1
  flutter:
    sdk: flutter
  http: ^1.6.0
  image: ^4.10.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  pasteboard:
    # Vendored: Built-in Kotlin fix (see third_party/README.md).
    path: third_party/pasteboard
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdfrx: ^2.6.5
  # QR codes for sync setup links (pure Dart; already used by pdf).
  qr: ^3.0.2
  record: ^7.1.2
  share_plus: ^13.3.1
  sqlite3: ^3.7.0
  uuid: ^4.6.0
  web: ^1.1.1
  url_launcher: ^6.3.3
  material_symbols_icons: ^4.2960.0
  flutter_secure_storage: ^11.2.0
  # Live sync's connection (sync/live_channel.dart; every platform).
  web_socket_channel: ^3.0.3

dev_dependencies:
  fake_async: ^1.3.3
  file_selector_platform_interface: ^2.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The real sync server, run in process by the fault-injection sync tests
  # (test/support/real_server.dart).
  len_sync_server:
    path: ../server
  shelf: ^1.4.2

flutter:
  uses-material-design: true
  # Fonts (SIL OFL 1.1; built by tool/build_fonts.py): Sofia Sans for the
  # UI (docs/DESIGN.md §2); the text-box fonts, bundled so text boxes look
  # and wrap the same on every platform and in PDF export.
  assets:
    - assets/fonts/
  fonts:
    - family: Sofia Sans
      fonts:
        - asset: assets/fonts/SofiaSans-Regular.ttf
        - asset: assets/fonts/SofiaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/SofiaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SofiaSans-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic
        - asset: assets/fonts/Lora-BoldItalic.ttf
          weight: 700
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Regular.ttf
        - asset: assets/fonts/Caveat-Bold.ttf
          weight: 700
    # Fallbacks of the text-box fonts for right-to-left scripts.
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: Noto Sans Hebrew
      fonts:
        - asset: assets/fonts/NotoSansHebrew-Regular.ttf
        - asset: assets/fonts/NotoSansHebrew-Bold.ttf
          weight: 700
