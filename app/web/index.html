<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href /path/` when not served from the root. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Len — handwriting-first notes: paged notebooks, an infinite canvas and self-hosted sync.">
  <meta name="theme-color" content="#F4F4F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- Installable (PWA) on Android / desktop Chrome, home-screen app on iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Len">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/svg+xml" href="icons/len.svg">

  <title>Len</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F4F4F4; }
    @media (prefers-color-scheme: dark) { html, body { background: #1A1A1A; } }
    /* Shown while the app loads; the Flutter view covers it once running. */
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    }
    #splash img { width: 96px; height: 96px; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .55; transform: scale(.96); } }
    @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="icons/len.svg" alt=""></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
