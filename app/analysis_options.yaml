include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - third_party/**
    - build/**
    - android/**
    - windows/**
    - linux/**
    - web/**
    # Needs the integration_test package, which tool/e2e.sh adds for its
    # run only (in pubspec, Gradle fails to configure its Android project
    # from the read-only Nix store, breaking Android builds).
    - integration_test/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_lambdas

formatter:
  page_width: 100
