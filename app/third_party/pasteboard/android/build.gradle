group = "one.mixin.pasteboard"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// Len patch: AGP 9+ compiles Kotlin itself ("built-in Kotlin"); only apply
// the Kotlin Gradle Plugin on older AGP or when built-in Kotlin is disabled.
def agpMajor = 0
try {
    agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
} catch (ignored) {
    agpMajor = 0
}
def builtInKotlin = agpMajor >= 9
if (builtInKotlin && project.hasProperty('android.builtInKotlin')) {
    builtInKotlin = project.property('android.builtInKotlin').toString().toBoolean()
}
if (!builtInKotlin) {
    // Via pluginManager (not `apply plugin:`) so Flutter's text-based KGP
    // detector doesn't flag this conditional application.
    project.pluginManager.apply("kotlin-android")
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "one.mixin.pasteboard"
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    if (!builtInKotlin) {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_1_8
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

}

if (builtInKotlin) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
}
