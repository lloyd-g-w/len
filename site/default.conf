# Len web app. Serve it over HTTPS (a reverse proxy in front): the offline
# service worker only runs in a secure context.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm
               application/manifest+json image/svg+xml font/ttf font/otf;
    gzip_min_length 1024;

    # Entry points and the service worker: always revalidate, so open and
    # installed copies pick up a new release on their next start.
    location ~ ^/(|index\.html|sw\.js|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json|version\.json)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Everything else: short browser caching (file names are not hashed).
    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }
}
