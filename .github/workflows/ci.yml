name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the Flutter in flake.nix (`nix develop -c flutter --version`).
  FLUTTER_VERSION: "3.47.4"

# Only the quick checks run here; builds, the slow tier, end-to-end and the
# web walk-through run locally (README "Develop"). Releases: release.yml.
jobs:
  app-test:
    name: App · analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true # caches the SDK and ~/.pub-cache
      - run: flutter pub get
      - run: flutter analyze
      # The fast tier (= flutter test --exclude-tags slow, in bundled shards);
      # the slow one (perf, screenshots) runs locally: tool/test.sh slow
      # (docs/CONVENTIONS.md, Tooling).
      - run: tool/test.sh

  server-test:
    name: Server · analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2 # same Dart SDK as the app
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get --enforce-lockfile
      - run: dart analyze --fatal-infos
      - run: dart test
