name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the Flutter in flake.nix (`nix develop -c flutter --version`).
  FLUTTER_VERSION: "3.47.4"

jobs:
  app-test:
    name: App · analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true # caches the SDK and ~/.pub-cache
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  wet-ink-kotlin:
    # The low-latency overlay's Kotlin model (android/.../WetInk*.kt) on a
    # plain JVM, no Gradle: its unit tests (shared goldens, flat ends'
    # cuts, prediction replay) and the parity check against the Dart model
    # the Ink Lab measures, over every case and recording with round, flat
    # and tapered ends (docs/INK_LAB.md, "Running").
    name: App · wet-ink Kotlin parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      LEN_NO_NIX: "1"
      KOTLIN_VERSION: "2.4.20" # nixpkgs' kotlin, as tool/wet_ink_check runs locally
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Kotlin compiler (cached)
        id: kotlin-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kotlin.zip
          key: kotlin-compiler-${{ env.KOTLIN_VERSION }}
      - name: Kotlin compiler
        working-directory: ${{ runner.temp }}
        run: |
          if [ "${{ steps.kotlin-cache.outputs.cache-hit }}" != "true" ]; then
            curl -sSfL -o kotlin.zip \
              "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
          fi
          unzip -q kotlin.zip
          echo "$PWD/kotlinc/bin" >> "$GITHUB_PATH"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: tool/wet_ink_check/unit_test.sh
      - run: tool/wet_ink_check/check.sh

  server-test:
    name: Server · analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2 # same Dart SDK as the app
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get --enforce-lockfile
      - run: dart analyze --fatal-infos
      - run: dart test

  build-linux:
    name: Build · Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: len-linux-x64
          path: app/build/linux/x64/release/bundle
          retention-days: 7

  e2e-linux:
    # The real Linux app end to end (app/integration_test/, tool/e2e.sh):
    # two devices syncing through a local server, under Xvfb with Mesa.
    name: App · end-to-end (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux toolchain, virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev xvfb xauth libegl1 libgl1-mesa-dri
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: tool/e2e.sh
        working-directory: app
        env:
          LEN_E2E_OUT: ${{ runner.temp }}/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-pictures-and-logs
          path: ${{ runner.temp }}/e2e
          retention-days: 7

  build-apk:
    name: Build · Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: len-android-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-web:
    name: Build · Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Same-origin CanvasKit + the service worker's precache list (offline PWA).
      - run: tool/build_web.sh
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: len-web
          path: app/build/web
          retention-days: 7

  web-explore:
    # The web build walked through like a user in Chromium and Firefox
    # (app/tool/web_explore.py, README "Develop"): any console error,
    # exception or failed request fails it.
    name: Web · walk-through (Chromium, Firefox)
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: len-web
          path: app/build/web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright, browsers, virtual display
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium firefox
          sudo apt-get install -y xvfb xauth
      - run: python tool/web_explore.py build/web
        env:
          LEN_EXPLORE_BUNDLED: "1"
          LEN_EXPLORE_OUT: ${{ runner.temp }}/web-explore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-explore-screenshots
          path: ${{ runner.temp }}/web-explore
          retention-days: 7

  build-windows:
    name: Build · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
        working-directory: app
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $v = (Select-String -Path app/pubspec.yaml -Pattern '^version: *([^+]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # x64compatible needs Inno Setup ≥ 6.3: install or upgrade.
          choco upgrade innosetup --no-progress -y
          & $iscc "/DAppVersion=$v" "/DSourceDir=$PWD\app\build\windows\x64\runner\Release" "/DOutputDir=$PWD\dist" app\windows\installer\len.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: len-windows-x64
          path: app/build/windows/x64/runner/Release
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: len-windows-x64-setup
          path: dist/*.exe
          retention-days: 7

  server-docker:
    name: Server · Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          load: true
          tags: len-sync:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Smoke test
        run: |
          docker run -d --name len-sync -p 8080:8080 \
            -e LEN_SYNC_TOKEN=ci-token-0123456789abcdef len-sync:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/v1/health && exit 0
            sleep 1
          done
          docker logs len-sync
          exit 1
