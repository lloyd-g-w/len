name: Server image

# Publishes the sync server image on every push to main that changes it:
# ghcr.io/<owner>/len-sync:latest and :sha-<short>. Tagged releases
# (release.yml) add the version tags.
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server-image.yml"]
  workflow_dispatch:

concurrency:
  group: server-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Server image → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/len-sync
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Len sync server
            org.opencontainers.image.description=Self-hosted sync server for the Len notes app
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max
