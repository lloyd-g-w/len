name: Release

# Push a tag `vX.Y.Z` matching `version: X.Y.Z+N` in app/pubspec.yaml:
#   git tag v0.2.0 && git push origin v0.2.0
# Builds the apps (APKs, Linux tarball + Flatpak + AppImage, Windows zip + installer,
# web zip), attaches them to a GitHub release and pushes the sync
# server and web app images to ghcr.io/<owner>/len-sync and len-site.
# See README "Release".
#
# Secrets (Settings → Secrets and variables → Actions), all optional:
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias (e.g. len)
#   ANDROID_KEY_PASSWORD      key password
# Without them the APKs are signed with a throwaway debug key (installable,
# but not upgradable to/from properly signed builds). GHCR needs no secret:
# the workflow's GITHUB_TOKEN has `packages: write`.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.4"

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APKs are debug-signed."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build APKs (universal + per ABI)
        working-directory: app
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          v=${{ needs.version.outputs.version }}
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          cd build/app/outputs/flutter-apk
          cp app-release.apk "$dist/len-$v-android-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app-$abi-release.apk" "$dist/len-$v-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
        working-directory: app
      - name: Tarball
        run: |
          v=${{ needs.version.outputs.version }}
          mkdir -p dist
          cp -r app/build/linux/x64/release/bundle "len-$v"
          tar -czf "dist/len-$v-linux-x64.tar.gz" "len-$v"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  flatpak:
    name: Flatpak (from the Linux tarball)
    needs: [version, linux]
    runs-on: ubuntu-latest
    container:
      # Keep the GNOME version in step with runtime-version in the manifest.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux-dist
      - run: cp linux-dist/len-*-linux-x64.tar.gz app/linux/packaging/flatpak/len-linux-x64.tar.gz
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: app/linux/packaging/flatpak/dev.len.len.yml
          bundle: len-${{ needs.version.outputs.version }}-linux-x64.flatpak
          artifact-name: flatpak
          cache: false

  appimage:
    name: AppImage (from the Linux tarball)
    needs: [version, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux-dist
      - run: |
          sudo apt-get update
          sudo apt-get install -y file desktop-file-utils appstream zsync
      - name: Build (see app/linux/packaging/appimage/build-appimage.sh)
        run: |
          v=${{ needs.version.outputs.version }}
          tar -xzf "linux-dist/len-$v-linux-x64.tar.gz"
          mkdir -p dist
          # Update information for AppImageUpdate / Gear Lever: the .zsync of
          # the latest GitHub release.
          cd dist
          VERSION="$v" ../app/linux/packaging/appimage/build-appimage.sh "../len-$v" "len-$v-linux-x64.AppImage" \
            -u "gh-releases-zsync|${GITHUB_REPOSITORY_OWNER}|${GITHUB_REPOSITORY#*/}|latest|len-*-linux-x64.AppImage.zsync"
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
        working-directory: app
      - name: Zip
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse app/build/windows/x64/runner/Release "len-$v"
          Compress-Archive -Path "len-$v" -DestinationPath "dist/len-$v-windows-x64.zip"
      - name: Installer (Inno Setup; see app/windows/installer/len.iss)
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # x64compatible needs Inno Setup ≥ 6.3: install or upgrade.
          choco upgrade innosetup --no-progress -y
          & $iscc "/DAppVersion=$v" "/DSourceDir=$PWD\app\build\windows\x64\runner\Release" "/DOutputDir=$PWD\dist" app\windows\installer\len.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Same-origin CanvasKit + the service worker's precache list (offline PWA).
      - run: tool/build_web.sh
        working-directory: app
      - name: Zip
        run: |
          v=${{ needs.version.outputs.version }}
          mkdir -p dist
          (cd app/build/web && zip -qr "$GITHUB_WORKSPACE/dist/len-$v-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*

  server-image:
    name: Server image → GHCR
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/len-sync
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=Len sync server
            org.opencontainers.image.description=Self-hosted sync server for the Len notes app
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          # Manual runs (workflow_dispatch) build everything but publish nothing.
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-release
          cache-to: type=gha,scope=server-release,mode=max

  site-image:
    name: Site image → GHCR
    needs: [version, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The same build as the release's web zip.
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - run: mkdir web && unzip -q dist/len-${{ needs.version.outputs.version }}-web.zip -d web
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/len-site
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=Len web app
            org.opencontainers.image.description=The Len notes app for the web (PWA), served by nginx
      - uses: docker/build-push-action@v6
        with:
          context: site
          build-contexts: web=web
          platforms: linux/amd64,linux/arm64
          # Manual runs (workflow_dispatch) build everything but publish nothing.
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub release
    needs: [version, android, linux, flatpak, appimage, windows, web]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # winget manifests for this release's installer (submit them by hand or
      # with wingetcreate: docs/PACKAGING.md "Windows").
      - name: winget manifests
        run: |
          v=${{ needs.version.outputs.version }}
          app/windows/winget/fill.sh "$v" "dist/len-$v-windows-x64-setup.exe" "$GITHUB_REPOSITORY" winget
          (cd winget && zip -qr "../dist/len-$v-winget-manifests.zip" manifests)
      - run: ls -la dist && (cd dist && sha256sum -- * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          name: Len ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
